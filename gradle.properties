# project-wide gradle settings, settings made in the IDE override these

# memory for the gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# skip the configuration phase when no build script has changed
org.gradle.configuration-cache=true

# kotlin code style for this project, "official" or "obsolete"
kotlin.code.style=official

# agp 9 built-in kotlin forbids the kotlin.sourceSets DSL, which the ksp plugin still uses to
# register its generated source dirs, this is agp's own escape hatch
android.disallowKotlinSourceSets=false
