<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelly Reader · Add books</title>
<!-- tab icon: two paw prints like the paw prints emoji, drawn inline so the server needs no icon route; a data URI must stay on one line -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E%2A%7Bfill:%2356699A%7D%40media(prefers-color-scheme:dark)%7B%2A%7Bfill:%239DB0DE%7D%7D%3C/style%3E%3Cdefs%3E%3Cg id='p'%3E%3Cpath d='M16 15.5c-4.5 0-9 5.5-9 9.5 0 3 2.5 4.5 5 4 1.5-.5 2.5-1 4-1s2.5.5 4 1c2.5.5 5-1 5-4 0-4-4.5-9.5-9-9.5z'/%3E%3Cellipse cx='5.5' cy='14.5' rx='3' ry='4' transform='rotate(-25 5.5 14.5)'/%3E%3Cellipse cx='11.5' cy='7' rx='3.25' ry='4.5' transform='rotate(-8 11.5 7)'/%3E%3Cellipse cx='20.5' cy='7' rx='3.25' ry='4.5' transform='rotate(8 20.5 7)'/%3E%3Cellipse cx='26.5' cy='14.5' rx='3' ry='4' transform='rotate(25 26.5 14.5)'/%3E%3C/g%3E%3C/defs%3E%3Cuse href='%23p' transform='translate(20 20) rotate(-20) scale(.95) translate(-16 -16)'/%3E%3Cuse href='%23p' transform='translate(45 45) rotate(12) scale(.95) translate(-16 -16)'/%3E%3C/svg%3E">
<style>
  :root { --bg: #F4F3F0; --surface: #FFFFFF; --ink: #2E3035; --muted: #5F6368; --line: #E1E2E5;
          --tint: #ECEEF4; --tint-ink: #3E4A6E; --accent: #56699A; --ok-bg: #E4F2E8; --ok-ink: #1E6B3A;
          --err-bg: #F6E9E7; --err-ink: #8C3F38; --track: #E1E3E7; --lilac: #A88BD6;
          --honey: #C9955B; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1C1D20; --surface: #26282C; --ink: #E3E1DC; --muted: #A3A6AB; --line: #3A3D42;
            --tint: #2E3340; --tint-ink: #C3CCE6; --ok-bg: #22362A; --ok-ink: #8FCCA2;
            --err-bg: #3D2826; --err-ink: #E3A39B; --track: #3A3D42; --lilac: #C3B1E8;
            --honey: #DDB27F; }
  }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  #drop { display: block; box-sizing: border-box; border: 2px dashed var(--line); border-radius: 18px;
          background: var(--surface); padding: 40px 20px; text-align: center; cursor: pointer;
          transition: border-color .15s; }
  #drop.meow { border-color: var(--lilac); }
  #drop.bear { border-color: var(--honey); }
  #drop.over { border-color: var(--accent); }
  #drop strong { display: block; font-size: 17px; margin-bottom: 6px; }
  #drop span { color: var(--muted); font-size: 14px; }
  input[type=file] { display: none; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { background: var(--surface); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .name { font-weight: 600; word-break: break-all; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .bar div { height: 4px; background: var(--accent); width: 0; transition: width .1s; }
  .ok .sub { color: var(--ok-ink); }
  .err .sub { color: var(--err-ink); }
</style>
</head>
<body>
<main>
  <h1>Add books</h1>
  <p>Drop plain text files (.txt, UTF-8) here, or tap to choose. Any language works. They show up on the phone right away.</p>
  <label id="drop" for="files">
    <strong>Drop .txt files here</strong>
    <span>or tap to choose files</span>
    <input id="files" type="file" multiple accept=".txt,text/plain">
  </label>
  <ul id="list"></ul>
</main>
<script>
  const drop = document.getElementById('drop');
  const input = document.getElementById('files');
  const list = document.getElementById('list');
  const queue = [];
  let busy = false;

  // anything under a kilobyte, except an empty file, shows as 1 KB, the same as in the app
  function formatSize(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
    const kb = Math.round(bytes / 1024);
    return (bytes > 0 ? Math.max(kb, 1) : 0) + ' KB';
  }

  function addRow(file) {
    const li = document.createElement('li');
    li.innerHTML = '<div class="name"></div><div class="sub"></div><div class="bar"><div></div></div>';
    li.querySelector('.name').textContent = file.name;
    li.querySelector('.sub').textContent = formatSize(file.size) + ' · Waiting';
    list.appendChild(li);
    return li;
  }

  function setStatus(li, text, cls) {
    li.querySelector('.sub').textContent = formatSize(li.file.size) + ' · ' + text;
    if (cls) li.classList.add(cls);
    if (cls) li.querySelector('.bar').remove();
  }

  // one file at a time, so the phone shows one clear progress bar
  function upload(li) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');
      xhr.setRequestHeader('X-File-Name', encodeURIComponent(li.file.name));
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          li.querySelector('.bar div').style.width = pct + '%';
          setStatus(li, 'Uploading… ' + pct + '%');
        }
      };
      xhr.onload = () => {
        if (xhr.status === 200) setStatus(li, 'Added to shelf', 'ok');
        else setStatus(li, xhr.responseText || ('Failed (' + xhr.status + ')'), 'err');
        resolve();
      };
      xhr.onerror = () => { setStatus(li, 'Connection lost', 'err'); resolve(); };
      xhr.send(li.file);
    });
  }

  async function drain() {
    if (busy) return;
    busy = true;
    while (queue.length) await upload(queue.shift());
    busy = false;
  }

  function isTextFile(name) {
    return name.toLowerCase().endsWith('.txt');
  }

  // the same limit the app keeps
  const MAX_MB = 500;

  // files that are not .txt or are over the limit are skipped here, so they never travel
  // to the phone
  function enqueue(files) {
    for (const file of files) {
      const li = addRow(file);
      li.file = file;
      if (!isTextFile(file.name)) {
        setStatus(li, 'Not a .txt file, skipped', 'err');
        continue;
      }
      if (file.size > MAX_MB * 1024 * 1024) {
        setStatus(li, 'Over ' + MAX_MB + ' MB, skipped', 'err');
        continue;
      }
      queue.push(li);
    }
    drain();
  }

  input.addEventListener('change', () => { enqueue(input.files); input.value = ''; });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    enqueue(e.dataTransfer.files);
  });

  // typing "meow" in lower case anywhere on the page wakes the cat, and "bear" sends the bear
  // to the shelf on the phone
  let typed = '';
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    typed = (typed + e.key).slice(-4);
    if (typed === 'meow') {
      drop.classList.add('meow');
      drop.querySelector('strong').textContent =
        "Prrrr-meow? Just drop the .txt files here... I'll look at them after my nap~";
    } else if (typed === 'bear') {
      callBear();
    }
  });

  // the phone answers once the bear is on its way; nothing shows if it cannot be reached
  function callBear() {
    fetch('/bear', { method: 'POST' })
      .then((r) => {
        if (!r.ok) return;
        drop.classList.add('bear');
        drop.querySelector('strong').textContent = "hi~ I'll be on your shelf when you get back";
      })
      .catch(() => {});
  }
</script>
</body>
</html>
